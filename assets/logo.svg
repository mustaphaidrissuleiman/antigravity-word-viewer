<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ABD" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBF3FC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#051c38" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Sheet of Paper (Document) with Corner Fold -->
  <g filter="url(#shadow)">
    <!-- Main page -->
    <path d="M20 12 H40 L48 20 V50 C48 51.65 46.65 53 45 53 H20 C18.35 53 17 51.65 17 50 V15 C17 13.35 18.35 12 20 12 Z" fill="url(#pageGrad)" />
    <!-- Folded dog-ear corner -->
    <path d="M40 12 V18 C40 19.65 41.35 21 43 21 H48 Z" fill="#D3E4F8" />
  </g>

  <!-- Document Text Lines -->
  <rect x="23" y="24" width="18" height="2.5" rx="1.25" fill="#185ABD" opacity="0.3" />
  <rect x="23" y="29" width="20" height="2.5" rx="1.25" fill="#185ABD" opacity="0.3" />
  <rect x="23" y="34" width="16" height="2.5" rx="1.25" fill="#185ABD" opacity="0.3" />
  <rect x="23" y="39" width="19" height="2.5" rx="1.25" fill="#185ABD" opacity="0.3" />

  <!-- Signature Word "W" Tile in Foreground -->
  <g filter="url(#shadow)">
    <rect x="12" y="28" width="22" height="22" rx="4.5" fill="#107C41" />
    <!-- Gradient overlay for Word blue tile -->
    <rect x="12" y="28" width="22" height="22" rx="4.5" fill="#185ABD" />
    <!-- Bold 'W' lettermark -->
    <path d="M15.5 33.5 H18.2 L19.8 41.2 L21.7 34.6 H24.1 L26 41.2 L27.7 33.5 H30.3 L27.6 44.5 H24.8 L22.9 37.8 L21 44.5 H18.2 L15.5 33.5 Z" fill="#FFFFFF" />
  </g>
</svg>
